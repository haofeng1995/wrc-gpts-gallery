  .hero p { color: var(--text2); margin-top: 12px; font-size: 15px; line-height: 1.6; }
  .hero-meta { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .hero-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 13px; color: var(--text2); }

  .name-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; }

  .filter-label { color: var(--text2); font-size: 13px; margin-right: 4px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all .15s; font-family: inherit; }

  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 14px 7px 34px; font-size: 13px; width: 200px; font-family: inherit; outline: none; transition: border-color .15s; }

  .search-wrap input::placeholder { color: var(--text2); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 13px; }

  .grid { padding: 0 32px 64px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, transform .2s, box-shadow .2s; position: relative; overflow: hidden; animation: fadeIn .25s ease both; }

  .card-title { font-size: 15px; font-weight: 600; line-height: 1.4; flex: 1; }

  .io-chip { display: flex; align-items: center; gap: 5px; background: var(--surface2); border-radius: 6px; padding: 4px 8px; font-size: 11px; }

  .io-chip.output .io-label { color: var(--accent2); opacity: 1; }

  .open-btn:hover { opacity: 0.85; transform: scale(1.02); }

  .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text2); }

</head>

// --- USER ---
let currentUser = localStorage.getItem('wrc_user') || '';

function initUser() {
  if (currentUser) {
    showApp();
  } else {
    document.getElementById('nameOverlay').style.display = 'flex';
  }
}

function showApp() {
  document.getElementById('nameOverlay').style.display = 'none';
  const tag = document.getElementById('userTag');
  tag.textContent = '👤 ' + currentUser;
  tag.style.display = 'inline-flex';
  document.getElementById('footerUser').textContent = '登入身分：' + currentUser;
  renderCards();
}

function resetUser() {
  if (confirm('重設使用者身分？')) {
    localStorage.removeItem('wrc_user');
    localStorage.removeItem('wrc_log');
    currentUser = '';
    document.getElementById('nameOverlay').style.display = 'flex';
    document.getElementById('nameInput').value = '';
    document.getElementById('nameBtn').disabled = true;
  }
}

document.getElementById('nameInput').addEventListener('input', function() {
  document.getElementById('nameBtn').disabled = this.value.trim().length === 0;
});

document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) submitName();
});

document.getElementById('nameBtn').addEventListener('click', submitName);

function submitName() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  currentUser = val;
  localStorage.setItem('wrc_user', val);
  showApp();
}

// --- LOG CLICKS ---
function logClick(toolName) {
  const log = JSON.parse(localStorage.getItem('wrc_log') || '[]');
  log.push({ user: currentUser, tool: toolName, time: new Date().toISOString() });
  localStorage.setItem('wrc_log', JSON.stringify(log));
}

// --- RENDER ---
let currentFilter = 'all';
let currentSearch = '';

function getDisplayModule(item) {
  return MODULE_MAP[item.module] || 'AI輔助';
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  let filtered = GPTS.filter(item => {
    const mod = getDisplayModule(item);
    const matchFilter = currentFilter === 'all' || mod === currentFilter;
    const matchSearch = !currentSearch ||
      item.name.toLowerCase().includes(currentSearch) ||
      (item.desc || '').toLowerCase().includes(currentSearch) ||
      item.role.toLowerCase().includes(currentSearch);
    return matchFilter && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:12px;">🔍</div><div style="font-size:16px;margin-bottom:8px;">找不到符合的工具</div></div>`;
    return;
  }

  if (currentFilter === 'all') {
    const groups = {};
    filtered.forEach(item => {
      const mod = getDisplayModule(item);
      if (!groups[mod]) groups[mod] = [];
      groups[mod].push(item);
    });
    const order = ['建群模組','主題模組','導購模組','遊戲化模組','分析模組','鋪陳收尾模組','AI輔助'];
    order.forEach(mod => {
      if (!groups[mod] || groups[mod].length === 0) return;
      const head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML = `<h2>${MODULE_GROUPS[mod]}</h2><span class="section-count">${groups[mod].length}</span>`;
      grid.appendChild(head);
      groups[mod].forEach(item => grid.appendChild(makeCard(item)));
    });
  } else {
    filtered.forEach(item => grid.appendChild(makeCard(item)));
  }
}

function makeCard(item) {
  const color = ROLE_COLORS[item.role] || '#5b7cf5';
  const div = document.createElement('div');
  div.className = 'card';
  div.style.setProperty('--role-color', color);

  const timingLabel = TIMING_LABELS[item.timing] || item.timing || '依需求';
  const inputChip = item.input ? `<div class="io-chip"><span class="io-label">輸入</span><span class="io-val">${item.input}</span></div>` : '';
  const outputChip = item.output ? `<div class="io-chip output"><span class="io-label">產出</span><span class="io-val">${item.output}</span></div>` : '';

  div.innerHTML = `
    <div class="card-header">
      <div class="card-title">${item.name}</div>
      <div class="role-badge" style="--role-color:${color}">${item.role}</div>
    </div>
    <div class="card-meta">
      <div class="meta-tag timing">⏱ ${timingLabel}使用</div>
      <div class="meta-tag">${getDisplayModule(item)}</div>
    </div>
    <div class="card-desc">${item.desc || '點擊開啟，查看完整功能說明'}</div>
    ${(inputChip || outputChip) ? `<div class="io-row">${inputChip}${outputChip}</div>` : ''}
    <div class="card-footer">
      <a class="open-btn" href="${item.link}" target="_blank" rel="noopener" onclick="logClick('${item.name.replace(/'/g,"\\'")}')">開啟 ↗</a>
    </div>
  `;
  return div;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase().trim();
  renderCards();
});

initUser();
</script>
